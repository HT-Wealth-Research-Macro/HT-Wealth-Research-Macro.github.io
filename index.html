<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>华泰财富研究・宏观固收团队</title>
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A4BD1;
  --blue-50:#EEF2FD;
  --blue-100:#D4DEF9;
  --blue-200:#A8BFF3;
  --blue-600:#1A4BD1;
  --blue-700:#1239A8;
  --amber:#E8870A;
  --amber-50:#FFF9F0;
  --amber-100:#FFF0D6;
  --amber-600:#D97706;
  --red:#DC2626;
  --gray-50:#F7F8FA;
  --gray-75:#F0F2F5;
  --gray-100:#E6E9ED;
  --gray-200:#D3D7DE;
  --gray-300:#B0B7C2;
  --gray-400:#8892A0;
  --gray-500:#5F6978;
  --gray-600:#3B434F;
  --gray-700:#262D38;
  --gray-900:#111620;
  --white:#FFF;
  --radius:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow:0 2px 6px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 6px 16px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --max-w:840px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--gray-900);
  background:linear-gradient(180deg, #F7F8FA 0%, #EDF0F5 100%);
  background-attachment:fixed;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* ===== Page Container ===== */
.page{max-width:var(--max-w);margin:0 auto;padding:0 24px}

/* ===== Header ===== */
.header{
  padding:22px 0 18px;text-align:center;
  background:linear-gradient(160deg, #0F2557 0%, #1A4BD1 50%, #1E3A8A 100%);
  margin:0 -24px 14px;padding-left:24px;padding-right:24px;
  position:relative;overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:-50px;right:-60px;width:140px;height:140px;
  background:rgba(255,255,255,.04);border-radius:50%;pointer-events:none;
}
.header::after{
  content:'';position:absolute;bottom:-30px;left:-40px;width:100px;height:100px;
  background:rgba(255,255,255,.03);border-radius:50%;pointer-events:none;
}
.header-tag{
  display:inline-block;font-size:.65rem;letter-spacing:.16em;color:rgba(255,255,255,.8);
  background:rgba(255,255,255,.1);padding:4px 14px;border-radius:99px;font-weight:600;
  margin-bottom:10px;backdrop-filter:blur(4px);
}
.header h1{
  font-size:1.4rem;font-weight:700;color:#FFF;letter-spacing:.04em;
  margin-bottom:3px;position:relative;z-index:1;
}
.header .sub{
  font-size:.8rem;color:rgba(255,255,255,.65);font-weight:400;position:relative;z-index:1;
}
.header .deco-line{
  width:36px;height:2px;background:rgba(255,255,255,.3);margin:10px auto 0;border-radius:2px;
  position:relative;z-index:1;
}

/* ===== Section Title ===== */
.sec-title{
  font-size:1.1rem;font-weight:700;color:var(--gray-700);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
  letter-spacing:.02em;
}

/* ===== Team Section ===== */
.team-wrap{margin-bottom:12px}
.team-grid{display:flex;flex-wrap:wrap;gap:8px}
.researcher-card{
  position:relative;background:var(--white);border-radius:var(--radius-sm);
  padding:16px 10px 12px 16px;text-align:center;
  box-shadow:var(--shadow-sm);cursor:default;
  transition:box-shadow .2s,background .2s,border-color .2s;
  border:1.5px solid var(--gray-100);
  overflow:visible;flex:1 1 0;min-width:0;white-space:nowrap;
  display:flex;align-items:center;gap:6px;justify-content:center;
}
.researcher-card .r-body{
  display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0;
}
.researcher-card .r-body:hover .name{color:var(--blue)}
/* ⓘ 按钮 */
.researcher-card .r-info-btn{
  flex-shrink:0;width:auto;height:auto;border-radius:0;
  border:none;background:transparent;
  color:var(--gray-400);font-size:.85rem;cursor:pointer;
  padding:4px 6px;line-height:1;transition:color .15s;
}
.researcher-card .r-info-btn:hover{
  color:var(--blue);
}
.researcher-card.bio-visible{
  box-shadow:0 0 0 2px var(--blue),0 6px 18px rgba(26,75,209,.15);
  background:var(--blue-50);border-color:var(--blue);
}
/* 筛选选中态（高亮跟进筛选状态） */
.researcher-card.filtered{
  background:var(--blue-50);border-color:var(--blue);
  box-shadow:0 0 0 1.5px var(--blue),0 4px 12px rgba(26,75,209,.1);
}
.researcher-card .r-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg, var(--blue), #4F7DF3);
  color:#FFF;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.researcher-card .r-info{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;gap:3px}
.researcher-card .name{font-size:.85rem;font-weight:700;color:var(--gray-900)}
.researcher-card .title{font-size:.68rem;color:var(--gray-400);font-weight:500}
.researcher-card.bio-visible .r-avatar{
  background:linear-gradient(135deg, var(--blue-700), var(--blue));
}
/* Bio popup —— 气泡弹窗 + 小箭头，内容可滚动 */
.researcher-card .bio-popup{
  position:fixed;top:140px;left:50%;transform:translateX(-50%);
  background:var(--gray-900);color:rgba(255,255,255,.9);font-size:.82rem;line-height:1.7;
  white-space:normal;word-break:break-word;
  border-radius:var(--radius-sm);width:360px;max-width:92vw;
  max-height:50vh;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:10000;
  text-align:left;font-weight:400;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  pointer-events:auto;overflow:hidden;
}
/* 气泡小箭头 */
.researcher-card .bio-popup::before{
  content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:9px solid var(--gray-900);
}
.researcher-card .bio-popup .bio-scroll{
  padding:14px 18px;overflow-y:auto;flex:1;min-height:0;
  white-space:normal;word-break:break-word;
  -webkit-overflow-scrolling:touch;
}
/* ✕ 关闭按钮 */
.researcher-card .bio-popup .bio-close-x{
  position:absolute;top:4px;right:6px;
  width:28px;height:28px;border:none;background:transparent;
  color:rgba(255,255,255,.45);font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:all .15s;z-index:1;
  line-height:1;padding:0;
}
.researcher-card .bio-popup .bio-close-x:hover{
  background:rgba(255,255,255,.1);color:#FFF;
}
.researcher-card .bio-popup .bio-name{
  font-size:.88rem;font-weight:700;color:#FFF;margin-bottom:2px;
}
.researcher-card .bio-popup .bio-title{
  font-size:.68rem;color:rgba(255,255,255,.5);font-weight:500;margin-bottom:8px;
}
/* 手机端：点击卡片切换 bio */
.researcher-card.bio-visible .bio-popup{opacity:1;visibility:visible}


/* ===== Hot Topics ===== */
.hot-section{margin-bottom:14px}
.hot-section .hot-bg{
  background:var(--white);
  border-radius:var(--radius);padding:12px 14px;
  border:1px solid var(--gray-100);box-shadow:var(--shadow-sm);
}
.hot-scroll{
  display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:2px 2px 6px;cursor:grab;
}
.hot-scroll:active{cursor:grabbing}
.hot-scroll::-webkit-scrollbar{height:4px}
.hot-scroll::-webkit-scrollbar-track{background:transparent}
.hot-scroll::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}
.hot-scroll:hover::-webkit-scrollbar-thumb{background:var(--gray-300)}
.hot-card{
  flex:0 0 auto;width:200px;min-width:170px;scroll-snap-align:start;
  background:var(--white);border-radius:var(--radius-sm);padding:14px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .2s,background .2s;
  border:2px solid var(--amber-100);user-select:none;
  position:relative;overflow:visible;
  display:flex;align-items:flex-start;gap:10px;
}
@media(hover:hover){.hot-card:hover{border-color:var(--amber-200)}}
.hot-card.active{border-color:var(--amber);background:var(--amber-50)}
.hot-cat-label{font-size:.7rem;font-weight:600;color:var(--amber);margin-right:2px}
.hot-new-icon{
  font-size:.6rem;font-weight:800;letter-spacing:.04em;
  color:#FFF;background:var(--amber);
  padding:3px 6px;border-radius:3px;
  display:inline-block;line-height:1;
}
.hot-card .hot-icon{font-size:1.2rem;flex-shrink:0;margin-top:4px}
.hot-card .hot-theme{font-size:.78rem;font-weight:600;color:var(--gray-900);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

/* ===== Search & Filter Panel ===== */
.filter-panel{
  background:var(--white);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--gray-100);
}
.filter-panel .search-row{display:flex;gap:8px;margin-bottom:10px}
.search-wrap{flex:1;position:relative;display:flex;align-items:center}
.search-wrap .search-input{width:100%;padding-right:28px}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--gray-400);cursor:pointer;padding:2px 4px;line-height:1;transition:color .15s}
.search-clear:hover{color:var(--gray-700)}
.filter-panel .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.filter-panel .filter-tags{display:flex;flex-wrap:nowrap;gap:6px;flex:1;overflow-x:auto;overflow-y:hidden;align-items:center}
.filter-panel .reset-btn{flex-shrink:0}
.expand-btn{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--gray-200);background:var(--white);
  color:var(--gray-500);font-size:.7rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;padding:0;line-height:1;
}
.expand-btn:hover{border-color:var(--blue-200);color:var(--blue)}
.expand-btn.active{background:var(--blue-50);border-color:var(--blue);color:var(--blue);transform:rotate(180deg)}
/* 展开态：标签换行 */
.filter-tags.expanded{flex-wrap:wrap!important;overflow-x:visible!important}
.filter-panel .filter-tag{white-space:nowrap;flex-shrink:0;margin:0}
.search-input{
  flex:1;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  padding:11px 16px;font-size:.9rem;font-family:var(--font);color:var(--gray-900);
  outline:none;transition:border-color .2s,box-shadow .2s;background:var(--white);
}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(26,75,209,.1)}
.search-input::placeholder{color:var(--gray-400)}
.search-btn{
  flex-shrink:0;padding:11px 24px;background:var(--blue);color:var(--white);
  border:none;border-radius:var(--radius-sm);font-size:.82rem;font-weight:700;
  cursor:pointer;font-family:var(--font);transition:background .2s,transform .15s;
}
.search-btn:hover{background:var(--blue-700);transform:scale(1.02)}
.search-btn:active{transform:scale(.98)}

/* Category Tags */
.filter-label{font-size:.85rem;color:var(--gray-600);margin-bottom:10px;font-weight:600}
.filter-tags{display:flex;flex-wrap:wrap;gap:8px}
.filter-tag{
  font-size:.78rem;padding:7px 16px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--gray-200);color:var(--gray-600);background:var(--white);
  transition:all .2s;font-family:var(--font);white-space:nowrap;user-select:none;
  font-weight:500;display:inline-flex;align-items:center;line-height:1;
}
.filter-tag.active{background:var(--blue);color:var(--white);border-color:var(--blue);font-weight:600}
@media(hover:hover){
  .filter-tag:hover{border-color:var(--blue-200);background:var(--blue-50);color:var(--blue)}
}

/* Speaker Filter */
.speaker-row{display:flex;gap:10px;margin-bottom:16px}
.speaker-chip{
  font-size:.87rem;padding:8px 22px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--gray-200);color:var(--gray-600);background:var(--white);
  transition:all .2s;font-family:var(--font);user-select:none;font-weight:500;
}
.speaker-chip.active{background:var(--blue);color:var(--white);border-color:var(--blue);font-weight:600}
@media(hover:hover){
  .speaker-chip:hover{border-color:var(--blue-200);background:var(--blue-50);color:var(--blue)}
}

/* Reset */
.reset-btn{
  font-size:.78rem;padding:7px 16px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--gray-200);color:var(--gray-500);background:var(--white);
  transition:all .2s;font-family:var(--font);font-weight:500;
  display:inline-flex;align-items:center;line-height:1;
}
.reset-btn:hover{border-color:var(--gray-300);color:var(--gray-700);background:var(--gray-75)}

/* Active filter summary */
.filter-summary{font-size:.78rem;color:var(--gray-400);margin-left:8px}

.topic-list{margin-bottom:20px}
/* 筛选状态栏 */
.filter-status{
  background:var(--blue-50);color:var(--blue);font-size:.78rem;font-weight:600;
  padding:8px 14px;border-radius:var(--radius-sm);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;border:1px solid var(--blue-100);
}
.filter-status .fs-tag{
  background:var(--blue);color:#FFF;padding:2px 12px;border-radius:99px;font-size:.72rem;
}
.filter-status .fs-topic{
  color:var(--gray-700);font-size:.76rem;font-weight:400;margin-left:2px;
}
.filter-status .fs-row{display:inline-flex;align-items:center;gap:4px}
.filter-status .fs-tag{display:inline-flex;align-items:center;gap:2px}
.filter-status .fs-x{
  font-size:.6rem;color:rgba(255,255,255,.6);cursor:pointer;
  margin-left:2px;transition:color .15s;line-height:1;
}
.filter-status .fs-x:hover{color:#FFF}
.topic-card{
  background:var(--white);border-radius:var(--radius);padding:14px 18px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .25s,transform .25s,border-color .25s;
  margin-bottom:8px;display:block;
  border:1.5px solid var(--gray-100);
  border-left:5px solid var(--gray-200);
  position:relative;overflow:visible;
}
.topic-card:hover{
  box-shadow:var(--shadow-lg);transform:translateY(-2px);
  border-color:var(--gray-200);
}
.topic-card:hover{border-left-color:var(--blue);}

/* NEW topic highlight */
.topic-card.is-new{
  border-left-color:var(--amber);
  background:linear-gradient(135deg, #FFFBF5 0%, #FFF 40%);
  animation: newGlow 2.5s ease-in-out infinite;
}
@keyframes newGlow{
  0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(232,135,10,.08)}
  50%{box-shadow:var(--shadow-md),0 0 0 6px rgba(232,135,10,.04)}
}
.topic-card .new-badge{
  position:absolute;top:-9px;right:18px;
  display:inline-flex;align-items:center;gap:3px;
  font-size:.62rem;font-weight:800;letter-spacing:.06em;
  color:#FFF;background:linear-gradient(135deg, var(--amber), #F59E0B);
  padding:4px 12px;border-radius:99px;
  box-shadow:0 3px 10px rgba(232,135,10,.3);
  animation: newPulse 1.8s ease-in-out infinite;
  z-index:2;
}
@keyframes newPulse{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}
.topic-card .new-badge::before{content:'🆕 ';font-size:.55rem}

.topic-card .card-title{
  font-size:.92rem;font-weight:700;color:var(--gray-900);line-height:1.5;
  margin-bottom:10px;padding-right:60px;
}
.topic-card .card-meta{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  font-size:.76rem;color:var(--gray-500);margin-bottom:10px;
}
.topic-card .card-meta .speaker{color:var(--blue);font-weight:600}
.topic-card .card-tags{display:flex;flex-wrap:wrap;gap:6px}
.topic-card .ctag{
  font-size:.68rem;padding:3px 11px;border-radius:99px;
  background:var(--gray-75);color:var(--gray-500);white-space:nowrap;
  font-weight:500;
}
.topic-card .ctag.cat{background:var(--blue-50);color:var(--blue);font-weight:600}

/* Category accent bar colors */
.topic-card[data-cat="宏观"]{border-left-color:#1A4BD1}
.topic-card[data-cat="资产配置"]{border-left-color:#7C3AED}
.topic-card[data-cat="固收"]{border-left-color:#059669}
.topic-card[data-cat="海外宏观"]{border-left-color:#0E7490}
.topic-card[data-cat="可转债"]{border-left-color:#DB2777}
.topic-card.is-new{border-left-color:var(--amber)!important}

/* ===== 建议分隔线 ===== */
.suggest-divider{
  text-align:center;font-size:.72rem;color:var(--gray-400);font-weight:600;
  padding:10px 0 6px;letter-spacing:.04em;
}

/* ===== Loading / Sentinel ===== */
.loading-hint{text-align:center;padding:28px 16px 44px;color:var(--gray-400);font-size:.82rem}
.sentinel{height:1px}

/* ===== Footer ===== */
.footer{
  text-align:center;padding:16px 0 24px;color:var(--gray-400);font-size:.76rem;
  border-top:1px solid var(--gray-100);margin-top:8px;
}
.footer .update{color:var(--gray-500);font-weight:500}

/* ===== No Results ===== */
.no-results{text-align:center;padding:56px 16px;color:var(--gray-400);font-size:.88rem}
.no-results .icon{font-size:2.4rem;margin-bottom:12px;opacity:.5}

/* ===== Toast ===== */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:var(--gray-900);color:var(--white);font-size:.8rem;
  padding:12px 24px;border-radius:99px;z-index:99;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
  pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.toast.show{opacity:1;visibility:visible}

/* ===== Back to Top ===== */
.back-to-top{
  position:fixed;bottom:80px;right:20px;z-index:998;
  width:46px;height:46px;border-radius:50%;
  background:var(--blue);color:#FFF;border:none;
  font-size:1.3rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 20px rgba(26,75,209,.35);
  opacity:0;visibility:hidden;transform:translateY(12px);
  transition:opacity .25s,visibility .25s,transform .25s;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.back-to-top.show{opacity:.92;visibility:visible;transform:translateY(0)}
.back-to-top:active{transform:scale(.9);opacity:1}

/* ===== Mobile ===== */
@media(max-width:600px){
  .header{padding:14px 0 12px;margin-bottom:10px}
  .header h1{font-size:1.15rem}
  .header .sub{font-size:.72rem}
  .header-tag{font-size:.58rem;padding:3px 10px;margin-bottom:6px}
  .header .deco-line{width:24px;margin:8px auto 0}
  .team-wrap{margin-bottom:10px}
  .team-grid{flex-wrap:nowrap!important;width:100%!important}
  .researcher-card{flex:1!important;min-width:0!important;width:0;padding:8px 2px;display:flex!important;flex-direction:column!important;align-items:center;justify-content:center;gap:2px}
  .researcher-card .r-body{flex-direction:column;gap:1px;align-items:center}
  .researcher-card .r-avatar{width:20px;height:20px;font-size:.55rem;margin-bottom:1px}
  .researcher-card .r-info{text-align:center;align-items:center}
  .researcher-card .name{font-size:.65rem;line-height:1.1}
  .researcher-card .title{font-size:.5rem;margin-left:0;line-height:1.1}
  .researcher-card .r-info-btn{position:absolute;top:2px;right:2px;font-size:.55rem;padding:0 2px}
  .researcher-card .bio-popup{top:50px;width:auto;max-width:96vw;max-height:45vh}
  .researcher-card .bio-popup .bio-scroll{padding:10px 14px}
  .hot-section{margin-bottom:12px}
  .hot-section .hot-bg{padding:8px 10px}
  .hot-card{width:155px;min-width:135px;padding:8px 10px}
  .hot-card .hot-icon{font-size:1rem;margin-top:2px}
  .hot-card .hot-theme{font-size:.7rem}

/* ===================================================================
   工具函数
   =================================================================== */
const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];

function getResearcher(id) { return RESEARCHERS.find(r => r.id === id); }

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===================================================================
   状态管理
   =================================================================== */
const state = {
  selectedCategories: new Set(),
  selectedSpeakers: new Set(),
  searchQuery: '',
  visibleCount: 0,
  hotPinnedId: null,
};

function getFilteredTopics() {
  const filtered = TOPICS.filter(t => {
    /* 热门置顶：优先展示该条，赛道标签叠加但不影响热门置顶 */
    if (state.hotPinnedId) {
      if (t.id !== state.hotPinnedId) return false;
    } else if (state.selectedCategories.size > 0) {
      if (!state.selectedCategories.has(t.category)) return false;
    }
    if (state.selectedSpeakers.size > 0 && !t.speakers.some(s => state.selectedSpeakers.has(s))) return false;
    if (state.searchQuery.trim()) {
      const q = state.searchQuery.trim().toLowerCase();
      const names = t.speakers.map(s => getResearcher(s)?.name || '').join(' ');
      const hay = (t.title + ' ' + t.subTags.join(' ') + ' ' + t.category + ' ' + names).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  return filtered.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
}

/* ===================================================================
   渲染函数
   =================================================================== */

/* 团队卡片 */
function renderTeam() {
  const grid = $('#teamGrid');
  grid.innerHTML = RESEARCHERS.map(r => `
    <div class="researcher-card${state.selectedSpeakers.has(r.id)?' filtered':''}" data-speaker="${r.id}">
      <div class="r-body">
        <div class="r-avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div>

          <div class="title">${r.title}</div>
        </div>
      </div>
      <button class="r-info-btn" data-speaker="${r.id}" aria-label="查看介绍">ⓘ</button>
      <div class="bio-popup"><button class="bio-close-x">✕</button><div class="bio-scroll"><div class="bio-name">${r.name}</div><div class="bio-title">${r.title}</div>${r.bio}</div></div>
    </div>
  `).join('');

  function closeAllBios() {
    document.querySelectorAll('.researcher-card.bio-visible').forEach(c => c.classList.remove('bio-visible'));
  }

  function updateTeamFiltered() {
    grid.querySelectorAll('.researcher-card').forEach(c => {
      c.classList.toggle('filtered', state.selectedSpeakers.has(c.dataset.speaker));
    });
  }

  /* ===== 卡片主体：点击 = 筛选切换 ===== */
  grid.querySelectorAll('.r-body').forEach(body => {
    body.addEventListener('click', (e) => {
      e.stopPropagation();
      const card = body.closest('.researcher-card');
      const sid = card.dataset.speaker;
      closeAllBios();
      if (state.selectedSpeakers.has(sid)) {
        state.selectedSpeakers.delete(sid);
      } else {
        state.selectedSpeakers.add(sid);
      }
      updateTeamFiltered();
      resetAndRender();
    });
  });

  /* ===== ⓘ 按钮：点击 = 弹窗介绍 ===== */
  grid.querySelectorAll('.r-info-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const card = btn.closest('.researcher-card');
      const isOpen = card.classList.contains('bio-visible');
      closeAllBios();
      if (!isOpen) {
        card.classList.add('bio-visible');
      }
    });
  });

  /* ===== ✕ 关闭按钮 ===== */
  grid.querySelectorAll('.bio-close-x').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeAllBios();
    });
  });

  updateTeamFiltered();

  /* 暴露给外部（主讲人筛选同步） */
  window._syncTeamCards = updateTeamFiltered;
}

/* 热门主题 —— 仅 hot:true 且非 NEW */
function renderHotTopics() {
  const container = $('#hotTopics');
  const topics = TOPICS.filter(t => t.hot);
  renderTopicCards(container, topics);
}

/* 新增主题 —— isNew:true */
function renderNewTopics() {
  const container = $('#newTopics');
  const topics = TOPICS.filter(t => t.isNew);
  const section = $('#newSection');
  if (topics.length === 0) { section.style.display = 'none'; return; }
  section.style.display = '';
  renderTopicCards(container, topics);
}

/* 通用：渲染热门/新增卡片 */
function renderTopicCards(container, topics) {
  const catIcons = { '宏观':'📊', '海外宏观':'🌐', '资产配置':'📈', '固收':'💰', '可转债':'🔄' };
  container.innerHTML = topics.map(t => `
    <div class="hot-card${t.isNew ? ' new' : ''}" data-id="${t.id}" data-cat="${t.category}">
      <div class="hot-icon">${t.isNew ? '<span class="hot-new-icon">NEW</span>' : (catIcons[t.category] || '📌')}</div>
      <div class="hot-theme"><span class="hot-cat-label">【${t.category}】</span>${t.title}</div>
    </div>
  `).join('');

  container.querySelectorAll('.hot-card').forEach(card => {
    card.addEventListener('click', () => {
      const cat = card.dataset.cat;
      const tid = parseInt(card.dataset.id);
      const topic = TOPICS.find(t => t.id === tid);
      if (!topic) return;
      const wasActive = card.classList.contains('active');
      document.querySelectorAll('.hot-card.active').forEach(c => c.classList.remove('active'));
      if (wasActive) {
        state.selectedCategories.clear();
        state.hotPinnedId = null;
        showToast('已取消筛选');
      } else {
        card.classList.add('active');
        state.selectedCategories.clear();
        state.selectedCategories.add(cat);
        state.hotPinnedId = tid;
        showToast('已筛选：' + cat);
      }
      state.searchQuery = '';
      $('#searchInput').value = '';
      renderCategoryTags();
      resetAndRender();
      appendSuggestions(topic);
    });
  });
}

/* 推3~5条：同赛道其他 + 其他赛道混合 */
function appendSuggestions(pinned) {
  const others = TOPICS.filter(t => t.id !== pinned.id);
  const sameCat = others.filter(t => t.category === pinned.category);
  const diffCat = others.filter(t => t.category !== pinned.category);
  const shuffledSame = sameCat.sort(() => Math.random() - 0.5).slice(0, 2);
  const shuffledDiff = diffCat.sort(() => Math.random() - 0.5).slice(0, 3);
  const picks = [...shuffledSame, ...shuffledDiff];
  if (picks.length === 0) return;
  const list = $('#topicList');
  const speakers = s => s.map(id => getResearcher(id)?.name || '').join('、');
  list.insertAdjacentHTML('beforeend',
    '<div class="suggest-divider">可能也感兴趣的主题</div>' +
    picks.map(t => `
      <a class="topic-card" href="javascript:void(0)" data-id="${t.id}" data-cat="${t.category}">
        <div class="card-title">${t.title}</div>
        <div class="card-meta">
          <span class="speaker">${speakers(t.speakers)}</span>
          <span>${t.date}</span>
        </div>
        <div class="card-tags">
          <span class="ctag cat">${t.category}</span>
          ${t.subTags.map(st => `<span class="ctag">${st}</span>`).join('')}
        </div>
      </a>
    `).join('')
  );
}

/* 赛道筛选标签 */
function renderCategoryTags() {
  const container = $('#categoryTags');
  container.innerHTML = CATEGORIES.map(c => `
    <span class="filter-tag${state.selectedCategories.has(c)?' active':''}" data-cat="${c}">${c}</span>
  `).join('');
  container.querySelectorAll('.filter-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const cat = tag.dataset.cat;
      /* 热门+另一赛道 → 自动取消热门，转双赛道筛选 */
      if (state.hotPinnedId) {
        const ht = TOPICS.find(t => t.id === state.hotPinnedId);
        if (ht && ht.category !== cat) {
          state.hotPinnedId = null;
          document.querySelectorAll('.hot-card.active').forEach(c => c.classList.remove('active'));
          state.selectedCategories.add(ht.category);
        }
      }
      state.selectedCategories.has(cat) ? state.selectedCategories.delete(cat) : state.selectedCategories.add(cat);
      /* 取消赛道 → 热门也跟着清 */
      if (state.selectedCategories.size === 0 && state.hotPinnedId) {
        state.hotPinnedId = null;
        document.querySelectorAll('.hot-card.active').forEach(c => c.classList.remove('active'));
      }
      renderCategoryTags();
      resetAndRender();
    });
  });
}

/* 渲染一批主题卡片（追加模式） */

  const list = $('#topicList');
  const batch = topics.slice(start, start + count);

  const html = batch.map(t => {
    const speakers = t.speakers.map(s => getResearcher(s)).filter(Boolean);
    const speakerNames = speakers.map(r => r.name).join('、');
    const isNew = t.isNew;
    return `
      <a class="topic-card${isNew ? ' is-new' : ''}" href="javascript:void(0)" data-id="${t.id}" data-cat="${t.category}">
        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
        <div class="card-title">${t.title}</div>
        <div class="card-meta">
          <span class="speaker">${speakerNames}</span>
          <span>${t.date}</span>
        </div>
        <div class="card-tags">
          <span class="ctag cat">${t.category}</span>
          ${t.subTags.map(st => `<span class="ctag">${st}</span>`).join('')}
        </div>
      </a>
    `;
  }).join('');
  list.insertAdjacentHTML('beforeend', html);
  return batch.length;
}

/* 清空并重新加载 */
function resetAndRender() {
  $('#topicList').innerHTML = '';
  state.visibleCount = 0;
  /* 筛选状态栏 */
  const status = $('#filterStatus');
  const parts = [];
  if (state.hotPinnedId) {
    const t = TOPICS.find(t => t.id === state.hotPinnedId);
    if (t) parts.push(`<span class="fs-row"><span class="fs-tag">${t.category}<span class="fs-x" data-action="clearHot">✕</span></span><span class="fs-topic">${t.title.length > 18 ? t.title.slice(0,18)+'…' : t.title}</span></span>`);
  }
  if (state.selectedCategories.size > 0) {
    [...state.selectedCategories].forEach(c => {
      if (state.hotPinnedId) {
        const ht = TOPICS.find(t => t.id === state.hotPinnedId);
        if (ht && ht.category === c) return;
      }
      parts.push(`<span class="fs-row"><span class="fs-tag">${c}<span class="fs-x" data-action="clearCat" data-cat="${c}">✕</span></span></span>`);
    });
  }
  if (state.selectedSpeakers.size > 0) {
    [...state.selectedSpeakers].forEach(s => {
      const r = getResearcher(s);
      if (r) parts.push(`<span class="fs-row"><span class="fs-tag">${r.name}<span class="fs-x" data-action="clearSpeaker" data-speaker="${s}">✕</span></span></span>`);
    });
  }
  if (parts.length > 0) {
    status.style.display = 'flex';
    status.innerHTML = '🔍 当前筛选：' + parts.join('');
  } else {
    status.style.display = 'none';
  }

  const filtered = getFilteredTopics();
  if (filtered.length === 0) {
    $('#topicList').innerHTML = '<div class="no-results"><div class="icon">🔍</div>未找到匹配的研究主题<br><span style="font-size:.75rem">尝试调整筛选条件或搜索关键词</span></div>';
    $('#loadingHint').textContent = '';
    $('#sentinel').style.display = 'none';
  } else {
    $('#sentinel').style.display = '';
    const loaded = renderTopicBatch(filtered, 0, SITE_CONFIG.pageSize);
    state.visibleCount = loaded;
    updateLoadingHint(filtered.length);
  }
}

function loadMore() {
  const filtered = getFilteredTopics();
  if (state.visibleCount >= filtered.length) return;
  const loaded = renderTopicBatch(filtered, state.visibleCount, SITE_CONFIG.pageSize);
  state.visibleCount += loaded;
  updateLoadingHint(filtered.length);
}

function updateLoadingHint(total) {
  if (state.visibleCount >= total) {
    $('#loadingHint').textContent = total > 0 ? '已展示全部 ' + total + ' 条主题' : '';
  } else {
    $('#loadingHint').textContent = `已加载 ${state.visibleCount} / ${total} 条`;
  }
}

/* Footer 时间 */
function renderFooter() {
  $('#updateTime').textContent = '数据更新于 ' + SITE_CONFIG.lastUpdate;
}

/* ===================================================================
   热门主题区触控板 / 鼠标滚轮横向滑动
   =================================================================== */
function setupHotScroll() {
  const el = $('#hotTopics');
  if (!el) return;
  makeScrollable(el);
}

/* 通用：滚轮 → 横向滑动 */
function makeScrollable(el) {
  el.addEventListener('wheel', e => {
    if (el.scrollWidth <= el.clientWidth) return;
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      el.scrollLeft += e.deltaY * 3;
    }
  }, { passive: false });
}

/* ===================================================================
   事件绑定
   =================================================================== */

$('#searchBtn').addEventListener('click', () => {
  state.searchQuery = $('#searchInput').value;
  resetAndRender();
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    state.searchQuery = $('#searchInput').value;
    resetAndRender();
  }
});
let searchTimer;
$('#searchInput').addEventListener('input', () => {
  const val = $('#searchInput').value;
  $('#searchClear').style.display = val ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = val;
    resetAndRender();
  }, 300);
});
$('#searchClear').addEventListener('click', () => {
  $('#searchInput').value = '';
  $('#searchClear').style.display = 'none';
  state.searchQuery = '';
  resetAndRender();
});

/* 展开/收起标签 */
$('#expandBtn').addEventListener('click', function() {
  this.classList.toggle('active');
  document.querySelector('.filter-tags').classList.toggle('expanded');
});

/* 筛选栏 ✕ 取消单个筛选 */
$('#filterStatus').addEventListener('click', e => {
  const x = e.target.closest('.fs-x');
  if (!x) return;
  const action = x.dataset.action;
  if (action === 'clearHot') {
    state.hotPinnedId = null;
    document.querySelectorAll('.hot-card.active').forEach(c => c.classList.remove('active'));
  } else if (action === 'clearCat') {
    state.selectedCategories.delete(x.dataset.cat);
  } else if (action === 'clearSpeaker') {
    state.selectedSpeakers.delete(x.dataset.speaker);
    if (window._syncTeamCards) window._syncTeamCards();
  }
  renderCategoryTags();
  resetAndRender();
});

$('#resetBtn').addEventListener('click', () => {
  state.selectedCategories.clear();
  state.selectedSpeakers.clear();
  state.hotPinnedId = null;
  document.querySelectorAll('.hot-card.active').forEach(c => c.classList.remove('active'));
  state.searchQuery = '';
  $('#searchInput').value = '';
  $('#searchClear').style.display = 'none';
  if (window._syncTeamCards) window._syncTeamCards();
  renderCategoryTags();
  resetAndRender();
  showToast('筛选条件已重置');
});

/* 无限滚动 (IntersectionObserver) */
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '120px' });
observer.observe($('#sentinel'));

/* 拦截路演卡片跳转 —— 阻止自动回顶部 */
$('#topicList').addEventListener('click', e => {
  const card = e.target.closest('.topic-card');
  if (card && /^(#|javascript:)/.test(card.getAttribute('href'))) {
    e.preventDefault();
  }
});

/* 置顶按钮 */
const backToTop = $('#backToTop');
let scrollTicking = false;
window.addEventListener('scroll', () => {
  if (!scrollTicking) {
    requestAnimationFrame(() => {
      backToTop.classList.toggle('show', window.scrollY > 200);
      scrollTicking = false;
    });
    scrollTicking = true;
  }
}, { passive: true });
backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ===================================================================
   初始化
   =================================================================== */
function init() {
  renderTeam();
  renderHotTopics();
  renderNewTopics();
  setupHotScroll();
  renderCategoryTags();
  resetAndRender();
  renderFooter();
  /* 筛选栏也支持滚轮横向滑动 */
  const fs = $('#filterStatus');
  const ft = document.querySelector('.filter-tags');
  if (fs) makeScrollable(fs);
  if (ft) makeScrollable(ft);
  /* 新增主题也横向滚动 */
  const nt = $('#newTopics');
  if (nt) makeScrollable(nt);
}
init();
</script>

</body>
