html{font-size:16px;scroll-behavior:smooth}
body{

a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

.header{

}
.header-tag{

}

.sec-title{

/* ===== Team Section ===== */
.team-wrap{margin-bottom:36px}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.researcher-card{

}
.researcher-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--blue-100)}
.researcher-card.filtered{

}
.researcher-card .avatar{

}
.researcher-card .avatar img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.researcher-card .avatar .fallback{

  font-size:1.3rem;font-weight:700;color:var(--blue);
}
.researcher-card .name{font-size:.92rem;font-weight:600;color:var(--gray-900);margin-bottom:2px}
.researcher-card .title{font-size:.75rem;color:var(--gray-400)}

.researcher-card .bio-popup{

  padding:10px 14px;border-radius:var(--radius-sm);width:200px;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:10;
  pointer-events:none;text-align:left;font-weight:400;
}
.researcher-card .bio-popup::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--gray-900);
}
.researcher-card:hover .bio-popup,
.researcher-card:active .bio-popup{opacity:1;visibility:visible}

/* ===== Hot Topics ===== */
.hot-section{margin-bottom:36px}
.hot-section .hot-bg{

  border-radius:var(--radius);padding:18px 16px;
  border:1px solid var(--gray-100);
}
.hot-scroll{
  display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding-bottom:2px;cursor:grab;
}
.hot-scroll:active{cursor:grabbing}
.hot-scroll::-webkit-scrollbar{height:4px}
.hot-scroll::-webkit-scrollbar-track{background:transparent}
.hot-scroll::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}
.hot-scroll:hover::-webkit-scrollbar-thumb{background:var(--gray-300)}
.hot-card{

  background:var(--white);border-radius:var(--radius);padding:18px 16px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .2s,transform .2s;

}
.hot-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.hot-card .hot-icon{font-size:1.4rem;margin-bottom:8px}
.hot-card .hot-badge{

.hot-card .hot-theme{font-size:.84rem;font-weight:600;color:var(--gray-900);line-height:1.4;margin-bottom:5px}
.hot-card .hot-desc{

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

.filter-panel{background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);margin-bottom:24px;border:1px solid var(--gray-100)}

.search-input{

  padding:10px 14px;font-size:.85rem;font-family:var(--font);color:var(--gray-900);

}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,81,200,.08);background:var(--white)}
.search-input::placeholder{color:var(--gray-400)}
.search-btn{

  border:none;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;

.search-btn:hover{background:var(--blue-700)}

.filter-label{font-size:.75rem;color:var(--gray-500);margin-bottom:8px;font-weight:500}
.filter-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.filter-tag{

}
.filter-tag:hover{border-color:var(--blue-200);background:var(--blue-50);color:var(--blue)}
.filter-tag.active{background:var(--blue);color:var(--white);border-color:var(--blue)}

.speaker-row{display:flex;gap:8px;margin-bottom:14px}
.speaker-chip{

.reset-btn:hover{border-color:var(--gray-300);color:var(--gray-700);background:var(--gray-100)}

.topic-card .card-title{font-size:.9rem;font-weight:600;color:var(--gray-900);line-height:1.5;margin-bottom:8px}
.topic-card .card-meta{

.topic-card .card-meta .speaker{color:var(--blue);font-weight:500}
.topic-card .card-tags{display:flex;flex-wrap:wrap;gap:5px}

.topic-card .ctag.cat{background:var(--blue-50);color:var(--blue);font-weight:500}

/* ===== Loading / Sentinel ===== */
.loading-hint{text-align:center;padding:24px 16px 40px;color:var(--gray-400);font-size:.8rem}
.sentinel{height:1px}

/* ===== Footer ===== */
.footer{
  text-align:center;padding:20px 0 40px;color:var(--gray-400);font-size:.75rem;
  border-top:1px solid var(--gray-100);margin-top:8px;

.footer .update{color:var(--gray-500)}

.no-results{text-align:center;padding:48px 16px;color:var(--gray-400);font-size:.85rem}
.no-results .icon{font-size:2.2rem;margin-bottom:10px;opacity:.6}

/* ===== Toast ===== */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--gray-900);color:var(--white);font-size:.8rem;
  padding:10px 20px;border-radius:99px;z-index:99;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
  pointer-events:none;
}
.toast.show{opacity:1;visibility:visible}

/* ===== Section Decoration ===== */
.section-divider{height:1px;background:var(--gray-100);margin:0 0 36px}

/* ===== Mobile ===== */

  .topic-card .card-title{font-size:.84rem}
}
@media(max-width:380px){
  .page{padding:0 12px}
  .header{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}

}

/* ===================================================================
   工具函数
   =================================================================== */
const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];

function getResearcher(id) { return RESEARCHERS.find(r => r.id === id); }

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===================================================================
   状态管理
   =================================================================== */
const state = {
  selectedCategories: new Set(),
  selectedSpeakers: new Set(),
  searchQuery: '',
  visibleCount: 0,
};

function getFilteredTopics() {
  return TOPICS.filter(t => {
    if (state.selectedCategories.size > 0 && !state.selectedCategories.has(t.category)) return false;
    if (state.selectedSpeakers.size > 0 && !t.speakers.some(s => state.selectedSpeakers.has(s))) return false;
    if (state.searchQuery.trim()) {
      const q = state.searchQuery.trim().toLowerCase();
      const names = t.speakers.map(s => getResearcher(s)?.name || '').join(' ');
      const hay = (t.title + ' ' + t.subTags.join(' ') + ' ' + t.category + ' ' + names).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ===================================================================
   渲染函数
   =================================================================== */

/* 团队卡片 */
function renderTeam() {
  const grid = $('#teamGrid');
  grid.innerHTML = RESEARCHERS.map(r => `
    <div class="researcher-card" data-speaker="${r.id}">
      <div class="avatar">
        <img src="${r.avatar}" alt="${r.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="fallback" style="display:none">${r.name.charAt(0)}</div>
      </div>
      <div class="name">${r.name}</div>
      <div class="title">${r.title}</div>
      <div class="bio-popup">${r.bio}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.researcher-card').forEach(card => {
    card.addEventListener('click', () => {
      const sid = card.dataset.speaker;
      if (state.selectedSpeakers.has(sid)) {
        state.selectedSpeakers.delete(sid);
      } else {
        state.selectedSpeakers.add(sid);
      }
      renderSpeakerChips();
      updateTeamActiveState();
      resetAndRender();
    });
  });
  updateTeamActiveState();
}

/* 热门主题 —— 使用 HOT_THEMES，每个代表一个研究方向 */
function renderHotTopics() {
  const container = $('#hotTopics');
  container.innerHTML = HOT_THEMES.map(ht => `
    <div class="hot-card" data-cat="${ht.filterCategory}">
      <div class="hot-icon">${ht.icon}</div>
      <div class="hot-badge">HOT</div>
      <div class="hot-theme">${ht.label}</div>
      <div class="hot-desc">${ht.desc}</div>
    </div>
  `).join('');

  /* 点击热门主题 → 筛选对应赛道 */
  container.querySelectorAll('.hot-card').forEach(card => {
    card.addEventListener('click', () => {
      const cat = card.dataset.cat;
      state.selectedCategories.clear();
      state.selectedCategories.add(cat);
      state.searchQuery = '';
      $('#searchInput').value = '';
      renderCategoryTags();
      resetAndRender();
      showToast('已筛选：' + cat);
    });
  });
}

/* 赛道筛选标签 */
function renderCategoryTags() {
  const container = $('#categoryTags');
  const activeCount = state.selectedCategories.size;
  $('#catSummary').textContent = activeCount > 0 ? `（已选 ${activeCount} 个）` : '（多选）';

  container.innerHTML = CATEGORIES.map(c => `
    <span class="filter-tag${state.selectedCategories.has(c)?' active':''}" data-cat="${c}">${c}</span>
  `).join('');
  container.querySelectorAll('.filter-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const cat = tag.dataset.cat;
      state.selectedCategories.has(cat) ? state.selectedCategories.delete(cat) : state.selectedCategories.add(cat);
      tag.classList.toggle('active');
      resetAndRender();
      /* 同步更新摘要 */
      const cnt = state.selectedCategories.size;
      $('#catSummary').textContent = cnt > 0 ? `（已选 ${cnt} 个）` : '（多选）';
    });
  });
}

/* 主讲人筛选 */
function renderSpeakerChips() {
  const container = $('#speakerChips');
  container.innerHTML = RESEARCHERS.map(r => `
    <span class="speaker-chip${state.selectedSpeakers.has(r.id)?' active':''}" data-speaker="${r.id}">${r.name}</span>
  `).join('');
  container.querySelectorAll('.speaker-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const sid = chip.dataset.speaker;
      state.selectedSpeakers.has(sid) ? state.selectedSpeakers.delete(sid) : state.selectedSpeakers.add(sid);
      chip.classList.toggle('active');
      updateTeamActiveState();
      resetAndRender();
    });
  });
}

/* 渲染一批主题卡片（追加模式） */
function renderTopicBatch(topics, start, count) {
  const list = $('#topicList');
  const batch = topics.slice(start, start + count);
  if (batch.length === 0) return 0;
  const html = batch.map(t => {
    const speakers = t.speakers.map(s => getResearcher(s)).filter(Boolean);
    const speakerNames = speakers.map(r => r.name).join('、');
    return `
      <a class="topic-card" href="#" data-id="${t.id}">
        <div class="card-title">${t.title}</div>
        <div class="card-meta">
          <span class="speaker">${speakerNames}</span>
          <span>${t.date}</span>
        </div>
        <div class="card-tags">
          <span class="ctag cat">${t.category}</span>
          ${t.subTags.map(st => `<span class="ctag">${st}</span>`).join('')}
        </div>
      </a>
    `;
  }).join('');
  list.insertAdjacentHTML('beforeend', html);
  return batch.length;
}

/* 清空并重新加载 */
function resetAndRender() {
  $('#topicList').innerHTML = '';
  state.visibleCount = 0;
  const filtered = getFilteredTopics();
  if (filtered.length === 0) {
    $('#topicList').innerHTML = '<div class="no-results"><div class="icon">🔍</div>未找到匹配的研究主题<br><span style="font-size:.75rem">尝试调整筛选条件或搜索关键词</span></div>';
    $('#loadingHint').textContent = '';
    $('#sentinel').style.display = 'none';
  } else {
    $('#sentinel').style.display = '';
    const loaded = renderTopicBatch(filtered, 0, SITE_CONFIG.pageSize);
    state.visibleCount = loaded;
    updateLoadingHint(filtered.length);
  }
}

function loadMore() {
  const filtered = getFilteredTopics();
  if (state.visibleCount >= filtered.length) return;
  const loaded = renderTopicBatch(filtered, state.visibleCount, SITE_CONFIG.pageSize);
  state.visibleCount += loaded;
  updateLoadingHint(filtered.length);
}

function updateLoadingHint(total) {
  if (state.visibleCount >= total) {
    $('#loadingHint').textContent = total > 0 ? '已展示全部 ' + total + ' 条主题' : '';
  } else {
    $('#loadingHint').textContent = `已加载 ${state.visibleCount} / ${total} 条`;
  }
}

/* 更新团队卡片选中态 */
function updateTeamActiveState() {
  $$('.researcher-card').forEach(card => {
    card.classList.toggle('filtered', state.selectedSpeakers.has(card.dataset.speaker));
  });
}

/* Footer 时间 */
function renderFooter() {
  $('#updateTime').textContent = '数据更新于 ' + SITE_CONFIG.lastUpdate;
}

/* ===================================================================
   热门主题区鼠标滚轮横向滚动
   =================================================================== */
function setupHotScroll() {
  const el = $('#hotTopics');
  if (!el) return;
  el.addEventListener('wheel', e => {
    /* 仅在内容溢出时拦截 */
    if (el.scrollWidth <= el.clientWidth) return;
    e.preventDefault();
    el.scrollLeft += e.deltaY;
  }, { passive: false });
}

/* ===================================================================
   事件绑定
   =================================================================== */

$('#searchBtn').addEventListener('click', () => {
  state.searchQuery = $('#searchInput').value;
  resetAndRender();
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    state.searchQuery = $('#searchInput').value;
    resetAndRender();
  }
});
let searchTimer;
$('#searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = $('#searchInput').value;
    resetAndRender();
  }, 300);
});

$('#resetBtn').addEventListener('click', () => {
  state.selectedCategories.clear();
  state.selectedSpeakers.clear();
  state.searchQuery = '';
  $('#searchInput').value = '';
  $('#catSummary').textContent = '（多选）';
  renderCategoryTags();
  renderSpeakerChips();
  updateTeamActiveState();
  resetAndRender();
  showToast('筛选条件已重置');
});

/* 无限滚动 (IntersectionObserver) */
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '120px' });
observer.observe($('#sentinel'));

/* ===================================================================
   初始化
   =================================================================== */
function init() {
  renderTeam();
  renderHotTopics();
  setupHotScroll();
  renderCategoryTags();
  renderSpeakerChips();
  resetAndRender();
  renderFooter();
}
init();
</script>
