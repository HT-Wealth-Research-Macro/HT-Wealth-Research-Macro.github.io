<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华泰财富研究・宏观固收团队</title>
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A4BD1;
  --blue-50:#EEF2FD;
  --blue-100:#D4DEF9;
  --blue-200:#A8BFF3;
  --blue-600:#1A4BD1;
  --blue-700:#1239A8;
  --amber:#E8870A;
  --amber-50:#FFF9F0;
  --amber-100:#FFF0D6;
  --amber-600:#D97706;
  --red:#DC2626;
  --gray-50:#F7F8FA;
  --gray-75:#F0F2F5;
  --gray-100:#E6E9ED;
  --gray-200:#D3D7DE;
  --gray-300:#B0B7C2;
  --gray-400:#8892A0;
  --gray-500:#5F6978;
  --gray-600:#3B434F;
  --gray-700:#262D38;
  --gray-900:#111620;
  --white:#FFF;
  --radius:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow:0 2px 6px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 6px 16px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --max-w:840px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--gray-900);
  background:linear-gradient(180deg, #F7F8FA 0%, #EDF0F5 100%);
  background-attachment:fixed;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* ===== Page Container ===== */
.page{max-width:var(--max-w);margin:0 auto;padding:0 24px}

/* ===== Header ===== */
.header{
  padding:56px 0 40px;text-align:center;
  background:linear-gradient(160deg, #0F2557 0%, #1A4BD1 50%, #1E3A8A 100%);
  margin:0 -24px 40px;padding-left:24px;padding-right:24px;
  position:relative;overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:-60px;right:-80px;width:220px;height:220px;
  background:rgba(255,255,255,.04);border-radius:50%;pointer-events:none;
}
.header::after{
  content:'';position:absolute;bottom:-40px;left:-60px;width:180px;height:180px;
  background:rgba(255,255,255,.03);border-radius:50%;pointer-events:none;
}
.header-tag{
  display:inline-block;font-size:.68rem;letter-spacing:.16em;color:rgba(255,255,255,.8);
  background:rgba(255,255,255,.1);padding:6px 16px;border-radius:99px;font-weight:600;
  margin-bottom:22px;backdrop-filter:blur(4px);
}
.header h1{
  font-size:1.75rem;font-weight:700;color:#FFF;letter-spacing:.04em;
  margin-bottom:6px;position:relative;z-index:1;
}
.header .sub{
  font-size:.88rem;color:rgba(255,255,255,.65);font-weight:400;position:relative;z-index:1;
}
.header .deco-line{
  width:48px;height:2.5px;background:rgba(255,255,255,.3);margin:16px auto 0;border-radius:2px;
  position:relative;z-index:1;
}

/* ===== Section Title ===== */
.sec-title{
  font-size:1.05rem;font-weight:700;color:var(--gray-700);
  margin-bottom:16px;display:flex;align-items:center;gap:10px;
}
.sec-title::before{
  content:'';display:inline-block;width:4px;height:20px;
  background:linear-gradient(180deg, var(--blue) 0%, #6D8FF0 100%);
  border-radius:2px;
}

/* ===== Team Section ===== */
.team-wrap{margin-bottom:40px}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.researcher-card{
  position:relative;background:var(--white);border-radius:var(--radius);
  padding:28px 18px 22px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;
  transition:box-shadow .25s,transform .25s,background .25s,border-color .25s;
  border:1.5px solid transparent;
  overflow:visible;
}
.researcher-card:hover{
  box-shadow:var(--shadow-lg);transform:translateY(-3px);
  border-color:var(--blue-200);
}
.researcher-card.filtered{
  box-shadow:0 0 0 2.5px var(--blue),0 6px 18px rgba(26,75,209,.12);
  background:var(--blue-50);border-color:var(--blue);
}
.researcher-card .avatar{
  width:64px;height:64px;border-radius:50%;
  margin:0 auto 14px;overflow:hidden;position:relative;
  background:var(--blue-100);
  box-shadow:0 4px 12px rgba(26,75,209,.15);
}
.researcher-card .avatar img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.researcher-card .avatar .fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;font-weight:700;color:var(--blue);
}
.researcher-card .name{font-size:.95rem;font-weight:700;color:var(--gray-900);margin-bottom:3px}
.researcher-card .title{font-size:.76rem;color:var(--gray-400);font-weight:500}
/* Bio popup */
.researcher-card .bio-popup{
  position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
  background:var(--gray-900);color:var(--white);font-size:.75rem;line-height:1.55;
  padding:12px 16px;border-radius:var(--radius-sm);width:220px;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:10;
  pointer-events:none;text-align:left;font-weight:400;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.researcher-card .bio-popup::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--gray-900);
}
.researcher-card:hover .bio-popup,
.researcher-card:active .bio-popup{opacity:1;visibility:visible}

/* ===== Hot Topics ===== */
.hot-section{margin-bottom:40px}
.hot-section .hot-bg{
  background:var(--white);
  border-radius:var(--radius);padding:20px 18px;
  border:1px solid var(--gray-100);box-shadow:var(--shadow-sm);
}
.hot-scroll{
  display:flex;flex-wrap:nowrap;gap:12px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;cursor:grab;
}
.hot-scroll:active{cursor:grabbing}
.hot-scroll::-webkit-scrollbar{height:5px}
.hot-scroll::-webkit-scrollbar-track{background:transparent}
.hot-scroll::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:3px}
.hot-scroll:hover::-webkit-scrollbar-thumb{background:var(--gray-300)}
.hot-card{
  flex:0 0 auto;width:220px;min-width:190px;scroll-snap-align:start;
  background:var(--white);border-radius:var(--radius);padding:20px 18px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .25s,transform .25s;
  border:1px solid var(--gray-100);user-select:none;
  position:relative;overflow:hidden;
}
.hot-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg, var(--blue), #6D8FF0);
}
.hot-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.hot-card .hot-icon{font-size:1.5rem;margin-bottom:10px}
.hot-card .hot-badge{
  display:inline-block;font-size:.6rem;color:var(--amber-600);background:var(--amber-50);
  padding:3px 10px;border-radius:99px;margin-bottom:10px;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--amber-100);
}
.hot-card .hot-theme{font-size:.86rem;font-weight:700;color:var(--gray-900);line-height:1.4;margin-bottom:6px}
.hot-card .hot-desc{
  font-size:.7rem;color:var(--gray-400);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ===== Search & Filter Panel ===== */
.filter-panel{
  background:var(--white);border-radius:var(--radius);padding:20px 22px;
  box-shadow:var(--shadow);margin-bottom:28px;border:1px solid var(--gray-100);
}

/* Search */
.search-row{display:flex;gap:10px;margin-bottom:18px}
.search-input{
  flex:1;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);
  padding:11px 16px;font-size:.85rem;font-family:var(--font);color:var(--gray-900);
  outline:none;transition:border-color .2s,box-shadow .2s;background:var(--gray-50);
}
.search-input:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(26,75,209,.1);background:var(--white)}
.search-input::placeholder{color:var(--gray-400)}
.search-btn{
  flex-shrink:0;padding:11px 24px;background:var(--blue);color:var(--white);
  border:none;border-radius:var(--radius-sm);font-size:.82rem;font-weight:700;
  cursor:pointer;font-family:var(--font);transition:background .2s,transform .15s;
}
.search-btn:hover{background:var(--blue-700);transform:scale(1.02)}
.search-btn:active{transform:scale(.98)}

/* Category Tags */
.filter-label{font-size:.75rem;color:var(--gray-500);margin-bottom:10px;font-weight:600}
.filter-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filter-tag{
  font-size:.73rem;padding:6px 14px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--gray-200);color:var(--gray-600);background:var(--white);
  transition:all .2s;font-family:var(--font);white-space:nowrap;user-select:none;
  font-weight:500;
}
.filter-tag:hover{border-color:var(--blue-200);background:var(--blue-50);color:var(--blue)}
.filter-tag.active{background:var(--blue);color:var(--white);border-color:var(--blue);font-weight:600}

/* Speaker Filter */
.speaker-row{display:flex;gap:10px;margin-bottom:16px}
.speaker-chip{
  font-size:.82rem;padding:8px 20px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--gray-200);color:var(--gray-600);background:var(--white);
  transition:all .2s;font-family:var(--font);user-select:none;font-weight:500;
}
.speaker-chip:hover{border-color:var(--blue-200);background:var(--blue-50);color:var(--blue)}
.speaker-chip.active{background:var(--blue);color:var(--white);border-color:var(--blue);font-weight:600}

/* Reset */
.reset-btn{
  font-size:.76rem;padding:7px 18px;border-radius:99px;cursor:pointer;
  border:1.5px solid var(--gray-200);color:var(--gray-500);background:var(--white);
  transition:all .2s;font-family:var(--font);font-weight:500;
}
.reset-btn:hover{border-color:var(--gray-300);color:var(--gray-700);background:var(--gray-75)}

/* Active filter summary */
.filter-summary{font-size:.72rem;color:var(--gray-400);margin-left:8px}

/* ===== Topic Cards ===== */
.topic-list{margin-bottom:28px}
.topic-card{
  background:var(--white);border-radius:var(--radius);padding:20px 22px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .25s,transform .25s,border-color .25s;
  margin-bottom:12px;display:block;
  border:1.5px solid var(--gray-100);
  border-left:5px solid var(--gray-200);
  position:relative;overflow:visible;
}
.topic-card:hover{
  box-shadow:var(--shadow-lg);transform:translateY(-2px);
  border-color:var(--gray-200);
}
.topic-card:hover{border-left-color:var(--blue);}

/* NEW topic highlight */
.topic-card.is-new{
  border-left-color:var(--amber);
  background:linear-gradient(135deg, #FFFBF5 0%, #FFF 40%);
  animation: newGlow 2.5s ease-in-out infinite;
}
@keyframes newGlow{
  0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(232,135,10,.08)}
  50%{box-shadow:var(--shadow-md),0 0 0 6px rgba(232,135,10,.04)}
}
.topic-card .new-badge{
  position:absolute;top:-9px;right:18px;
  display:inline-flex;align-items:center;gap:3px;
  font-size:.62rem;font-weight:800;letter-spacing:.06em;
  color:#FFF;background:linear-gradient(135deg, var(--amber), #F59E0B);
  padding:4px 12px;border-radius:99px;
  box-shadow:0 3px 10px rgba(232,135,10,.3);
  animation: newPulse 1.8s ease-in-out infinite;
  z-index:2;
}
@keyframes newPulse{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}
.topic-card .new-badge::before{content:'🆕 ';font-size:.55rem}

.topic-card .card-title{
  font-size:.92rem;font-weight:700;color:var(--gray-900);line-height:1.5;
  margin-bottom:10px;padding-right:60px;
}
.topic-card .card-meta{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  font-size:.76rem;color:var(--gray-500);margin-bottom:10px;
}
.topic-card .card-meta .speaker{color:var(--blue);font-weight:600}
.topic-card .card-tags{display:flex;flex-wrap:wrap;gap:6px}
.topic-card .ctag{
  font-size:.68rem;padding:3px 11px;border-radius:99px;
  background:var(--gray-75);color:var(--gray-500);white-space:nowrap;
  font-weight:500;
}
.topic-card .ctag.cat{background:var(--blue-50);color:var(--blue);font-weight:600}

/* Category accent bar colors */
.topic-card[data-cat="宏观经济"]{border-left-color:#1A4BD1}
.topic-card[data-cat="资产配置"]{border-left-color:#7C3AED}
.topic-card[data-cat="固定收益"]{border-left-color:#059669}
.topic-card[data-cat="海外宏观"]{border-left-color:#0E7490}
.topic-card[data-cat="可转债"]{border-left-color:#D97706}
.topic-card.is-new[data-cat="宏观经济"],
.topic-card.is-new[data-cat="资产配置"],
.topic-card.is-new[data-cat="固定收益"],
.topic-card.is-new[data-cat="海外宏观"],
.topic-card.is-new[data-cat="可转债"]{border-left-color:var(--amber)}

/* ===== Loading / Sentinel ===== */
.loading-hint{text-align:center;padding:28px 16px 44px;color:var(--gray-400);font-size:.82rem}
.sentinel{height:1px}

/* ===== Footer ===== */
.footer{
  text-align:center;padding:24px 0 44px;color:var(--gray-400);font-size:.76rem;
  border-top:1px solid var(--gray-100);margin-top:12px;
}
.footer .update{color:var(--gray-500);font-weight:500}

/* ===== No Results ===== */
.no-results{text-align:center;padding:56px 16px;color:var(--gray-400);font-size:.88rem}
.no-results .icon{font-size:2.4rem;margin-bottom:12px;opacity:.5}

/* ===== Toast ===== */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:var(--gray-900);color:var(--white);font-size:.8rem;
  padding:12px 24px;border-radius:99px;z-index:99;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
  pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.toast.show{opacity:1;visibility:visible}

/* ===== Section Decoration ===== */
.section-divider{height:1px;background:var(--gray-100);margin:0 0 40px}

/* ===== Mobile ===== */
@media(max-width:600px){
  .header{padding:40px 0 28px;margin-bottom:32px}
  .header h1{font-size:1.35rem}
  .header .sub{font-size:.8rem}
  .team-grid{grid-template-columns:1fr;gap:10px}
  .researcher-card{
    display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px;
  }
  .researcher-card .avatar{width:48px;height:48px;margin:0;flex-shrink:0}
  .researcher-card .avatar .fallback{font-size:1.1rem}
  .researcher-card .bio-popup{left:0;transform:none;width:200px;bottom:calc(100% + 8px)}
  .researcher-card .bio-popup::after{left:28px}
  .hot-section .hot-bg{padding:16px 14px}
  .hot-card{width:185px;min-width:160px;padding:16px}
  .hot-card .hot-theme{font-size:.8rem}
  .filter-panel{padding:16px 18px}
  .search-input{padding:10px 14px;font-size:.82rem}
  .search-btn{padding:10px 18px;font-size:.78rem}
  .filter-tags{gap:6px}
  .filter-tag{font-size:.7rem;padding:5px 11px}
  .speaker-chip{font-size:.76rem;padding:6px 16px}
  .topic-card{padding:16px 18px;margin-bottom:10px;border-left-width:4px}
  .topic-card .card-title{font-size:.86rem;padding-right:50px}
  .topic-card .new-badge{right:12px;font-size:.6rem;padding:3px 10px}
}
@media(max-width:380px){
  .page{padding:0 14px}
  .header{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
  .hot-card{width:160px;min-width:140px}
}
</style>
</head>
<body>

<div class="page">

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-tag">HUATAI SECURITIES</div>
    <h1>华泰财富研究・宏观固收团队</h1>
    <p class="sub">宏观视野 · 固收深耕 · 多资产策略</p>
    <div class="deco-line"></div>
  </header>

  <!-- ===== 一、团队展示 ===== -->
  <section class="team-wrap">
    <h2 class="sec-title">研究团队</h2>
    <div class="team-grid" id="teamGrid"><!-- JS 动态渲染 --></div>
  </section>

  <!-- ===== 二、热门主题 ===== -->
  <section class="hot-section">
    <h2 class="sec-title">热门主题</h2>
    <div class="hot-bg">
      <div class="hot-scroll" id="hotTopics"><!-- JS 动态渲染 --></div>
    </div>
  </section>

  <div class="section-divider"></div>

  <!-- ===== 三、筛选面板 ===== -->
  <section>
    <h2 class="sec-title">研究库</h2>
    <div class="filter-panel">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索路演标题、关键词...">
        <button class="search-btn" id="searchBtn">搜索</button>
      </div>
      <div class="filter-label">赛道分类<span class="filter-summary" id="catSummary"></span></div>
      <div class="filter-tags" id="categoryTags"><!-- JS 动态渲染 --></div>
      <div class="filter-label">主讲人</div>
      <div class="speaker-row" id="speakerChips"><!-- JS 动态渲染 --></div>
      <button class="reset-btn" id="resetBtn">↻ 重置筛选</button>
    </div>
  </section>

  <!-- ===== 四、主题卡片列表 ===== -->
  <div class="topic-list" id="topicList"><!-- JS 动态渲染 --></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="loading-hint" id="loadingHint"></div>

  <!-- ===== 五、Footer ===== -->
  <footer class="footer">
    <p class="update" id="updateTime"></p>
    <p style="margin-top:4px;">华泰证券 · 财富研究宏观固收团队</p>
  </footer>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   数据层 —— 所有内容配置集中于此，后续仅修改此区域即可
   =================================================================== */

const SITE_CONFIG = {
  teamName: '华泰财富研究・宏观固收团队',
  subtitle: '宏观视野 · 固收深耕 · 多资产策略',
  lastUpdate: '2026-07',
  pageSize: 8,
};

/* 研究员 —— 头像替换：修改 avatar 字段为实际图片路径即可 */
const RESEARCHERS = [
  {
    id: 'hexin',

    title: '首席研究员 · CFA',

  },

    avatar: 'ChenZezhen.png',
  },
  {
    id: 'xiaoxi',
    name: '肖熙',
    title: '研究员',
    bio: '本科就读于香港大学经济和金融学专业，硕士毕业于香港大学经济学专业，具备扎实的宏观经济与金融分析框架，具有良好的数据处理与逻辑分析能力，专注宏观、固收、大类资产方向研究。',
    avatar: 'XiaoXi.png',
  },
];

const CATEGORIES = [
  '宏观经济','资产配置','固定收益','海外宏观','可转债',
];

/* 热门主题 —— 这里是研究主题方向，非单篇课题 */
const HOT_THEMES = [
  {

/* ===================================================================
   工具函数
   =================================================================== */
const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];

function getResearcher(id) { return RESEARCHERS.find(r => r.id === id); }

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===================================================================
   状态管理
   =================================================================== */
const state = {
  selectedCategories: new Set(),
  selectedSpeakers: new Set(),
  searchQuery: '',
  visibleCount: 0,
};

function getFilteredTopics() {
  const filtered = TOPICS.filter(t => {
    if (state.selectedCategories.size > 0 && !state.selectedCategories.has(t.category)) return false;
    if (state.selectedSpeakers.size > 0 && !t.speakers.some(s => state.selectedSpeakers.has(s))) return false;
    if (state.searchQuery.trim()) {
      const q = state.searchQuery.trim().toLowerCase();
      const names = t.speakers.map(s => getResearcher(s)?.name || '').join(' ');
      const hay = (t.title + ' ' + t.subTags.join(' ') + ' ' + t.category + ' ' + names).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  /* 新增主题始终排在前面 */
  return filtered.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
}

/* ===================================================================
   渲染函数
   =================================================================== */

/* 团队卡片 */
function renderTeam() {
  const grid = $('#teamGrid');
  grid.innerHTML = RESEARCHERS.map(r => `
    <div class="researcher-card" data-speaker="${r.id}">
      <div class="avatar">
        <img src="${r.avatar}" alt="${r.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="fallback" style="display:none">${r.name.charAt(0)}</div>
      </div>
      <div class="name">${r.name}</div>
      <div class="title">${r.title}</div>
      <div class="bio-popup">${r.bio}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.researcher-card').forEach(card => {
    card.addEventListener('click', () => {
      const sid = card.dataset.speaker;
      if (state.selectedSpeakers.has(sid)) {
        state.selectedSpeakers.delete(sid);
      } else {
        state.selectedSpeakers.add(sid);
      }
      renderSpeakerChips();
      updateTeamActiveState();
      resetAndRender();
    });
  });
  updateTeamActiveState();
}

/* 热门主题 —— 使用 HOT_THEMES，每个代表一个研究方向 */
function renderHotTopics() {
  const container = $('#hotTopics');
  container.innerHTML = HOT_THEMES.map(ht => `
    <div class="hot-card" data-cat="${ht.filterCategory}">
      <div class="hot-icon">${ht.icon}</div>
      <div class="hot-badge">HOT</div>
      <div class="hot-theme">${ht.label}</div>
      <div class="hot-desc">${ht.desc}</div>
    </div>
  `).join('');

  /* 点击热门主题 → 筛选对应赛道 */
  container.querySelectorAll('.hot-card').forEach(card => {
    card.addEventListener('click', () => {
      const cat = card.dataset.cat;
      state.selectedCategories.clear();
      state.selectedCategories.add(cat);
      state.searchQuery = '';
      $('#searchInput').value = '';
      renderCategoryTags();
      resetAndRender();
      showToast('已筛选：' + cat);
    });
  });
}

/* 赛道筛选标签 */
function renderCategoryTags() {
  const container = $('#categoryTags');
  const activeCount = state.selectedCategories.size;
  $('#catSummary').textContent = activeCount > 0 ? `（已选 ${activeCount} 个）` : '（多选）';

  container.innerHTML = CATEGORIES.map(c => `
    <span class="filter-tag${state.selectedCategories.has(c)?' active':''}" data-cat="${c}">${c}</span>
  `).join('');
  container.querySelectorAll('.filter-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const cat = tag.dataset.cat;
      state.selectedCategories.has(cat) ? state.selectedCategories.delete(cat) : state.selectedCategories.add(cat);
      tag.classList.toggle('active');
      resetAndRender();
      /* 同步更新摘要 */
      const cnt = state.selectedCategories.size;
      $('#catSummary').textContent = cnt > 0 ? `（已选 ${cnt} 个）` : '（多选）';
    });
  });
}

/* 主讲人筛选 */
function renderSpeakerChips() {
  const container = $('#speakerChips');
  container.innerHTML = RESEARCHERS.map(r => `
    <span class="speaker-chip${state.selectedSpeakers.has(r.id)?' active':''}" data-speaker="${r.id}">${r.name}</span>
  `).join('');
  container.querySelectorAll('.speaker-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const sid = chip.dataset.speaker;
      state.selectedSpeakers.has(sid) ? state.selectedSpeakers.delete(sid) : state.selectedSpeakers.add(sid);
      chip.classList.toggle('active');
      updateTeamActiveState();
      resetAndRender();
    });
  });
}

/* 渲染一批主题卡片（追加模式） */
function renderTopicBatch(topics, start, count) {
  const list = $('#topicList');
  const batch = topics.slice(start, start + count);
  if (batch.length === 0) return 0;
  const html = batch.map(t => {
    const speakers = t.speakers.map(s => getResearcher(s)).filter(Boolean);
    const speakerNames = speakers.map(r => r.name).join('、');
    const isNew = t.isNew;
    return `
      <a class="topic-card${isNew ? ' is-new' : ''}" href="#" data-id="${t.id}" data-cat="${t.category}">
        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
        <div class="card-title">${t.title}</div>
        <div class="card-meta">
          <span class="speaker">${speakerNames}</span>
          <span>${t.date}</span>
        </div>
        <div class="card-tags">
          <span class="ctag cat">${t.category}</span>
          ${t.subTags.map(st => `<span class="ctag">${st}</span>`).join('')}
        </div>
      </a>
    `;
  }).join('');
  list.insertAdjacentHTML('beforeend', html);
  return batch.length;
}

/* 清空并重新加载 */
function resetAndRender() {
  $('#topicList').innerHTML = '';
  state.visibleCount = 0;
  const filtered = getFilteredTopics();
  if (filtered.length === 0) {
    $('#topicList').innerHTML = '<div class="no-results"><div class="icon">🔍</div>未找到匹配的研究主题<br><span style="font-size:.75rem">尝试调整筛选条件或搜索关键词</span></div>';
    $('#loadingHint').textContent = '';
    $('#sentinel').style.display = 'none';
  } else {
    $('#sentinel').style.display = '';
    const loaded = renderTopicBatch(filtered, 0, SITE_CONFIG.pageSize);
    state.visibleCount = loaded;
    updateLoadingHint(filtered.length);
  }
}

function loadMore() {
  const filtered = getFilteredTopics();
  if (state.visibleCount >= filtered.length) return;
  const loaded = renderTopicBatch(filtered, state.visibleCount, SITE_CONFIG.pageSize);
  state.visibleCount += loaded;
  updateLoadingHint(filtered.length);
}

function updateLoadingHint(total) {
  if (state.visibleCount >= total) {
    $('#loadingHint').textContent = total > 0 ? '已展示全部 ' + total + ' 条主题' : '';
  } else {
    $('#loadingHint').textContent = `已加载 ${state.visibleCount} / ${total} 条`;
  }
}

/* 更新团队卡片选中态 */
function updateTeamActiveState() {
  $$('.researcher-card').forEach(card => {
    card.classList.toggle('filtered', state.selectedSpeakers.has(card.dataset.speaker));
  });
}

/* Footer 时间 */
function renderFooter() {
  $('#updateTime').textContent = '数据更新于 ' + SITE_CONFIG.lastUpdate;
}

/* ===================================================================
   热门主题区触控板 / 鼠标滚轮横向滑动
   =================================================================== */
function setupHotScroll() {
  const el = $('#hotTopics');
  if (!el) return;
  el.addEventListener('wheel', e => {
    if (el.scrollWidth <= el.clientWidth) return;
    /* 垂直手势 → 转为横向滚动；水平手势 → 交给浏览器原生处理 */
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }
  }, { passive: false });
}

/* ===================================================================
   事件绑定
   =================================================================== */

$('#searchBtn').addEventListener('click', () => {
  state.searchQuery = $('#searchInput').value;
  resetAndRender();
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    state.searchQuery = $('#searchInput').value;
    resetAndRender();
  }
});
let searchTimer;
$('#searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = $('#searchInput').value;
    resetAndRender();
  }, 300);
});

$('#resetBtn').addEventListener('click', () => {
  state.selectedCategories.clear();
  state.selectedSpeakers.clear();
  state.searchQuery = '';
  $('#searchInput').value = '';
  $('#catSummary').textContent = '（多选）';
  renderCategoryTags();
  renderSpeakerChips();
  updateTeamActiveState();
  resetAndRender();
  showToast('筛选条件已重置');
});

/* 无限滚动 (IntersectionObserver) */
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '120px' });
observer.observe($('#sentinel'));

/* ===================================================================
   初始化
   =================================================================== */
function init() {
  renderTeam();
  renderHotTopics();
  setupHotScroll();
  renderCategoryTags();
  renderSpeakerChips();
  resetAndRender();
  renderFooter();
}
init();
</script>
